name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Restore binary resources
        run: |
          mkdir -p src/main/resources/assets/caminantenocturno/textures/entity
          base64 -d assets-src/skin.b64 > src/main/resources/assets/caminantenocturno/textures/entity/caminante_nocturno.png
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: caminante-nocturno-forge-1.20.1
          path: build/libs/*.jar
