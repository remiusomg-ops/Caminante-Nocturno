name: build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Caminante texture
        run: python3 tools/make_skin.py
      - name: Build item textures
        run: python3 tools/make_item_textures.py
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: caminante-nocturno-forge-1.20.1
          path: build/libs/*.jar
